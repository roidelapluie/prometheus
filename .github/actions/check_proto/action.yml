name: Check proto files
inputs:
  version:
    type: string
    description: Protoc version
    default: "3.5.1"
runs:
  using: composite
  steps:
    - run: |
        env
        set -x
        curl -s -L https://github.com/protocolbuffers/protobuf/releases/download/v$INPUT_VERSION/protoc-$INPUT_VERSION-linux-x86_64.zip > /tmp/protoc.zip
        unzip -d /tmp /tmp/protoc.zip
        chmod +x /tmp/bin/protoc
        echo 'export PATH=/tmp/bin:$PATH' >> $BASH_ENV
        source $BASH_ENV
        make proto
      shell: bash
    - run: git diff --exit-code
      shell: bash
