name: Publish image
inputs:
  docker_hub_organization:
    type: string
    description: DockerHub organization
    default: prom
  quay_io_organization:
    type: string
    description: Quay.io organization
    default: prometheus
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup_environment
    - uses: ./.github/actions/publish_images
      if: inputs.docker_hub_organization != "" && secrets.docker_hub_login != ""
      with:
        registry: docker.io
        organization: ${{ inputs.docker_hub_organization }}
        login: ${{ secrets.docker_hub_login }}
        password: ${{ secrets.docker_hub_password }}
    - uses: ./.github/actions/publish_images
      if: inputs.quay_io_organization != "" && secrets.quay_io_login != ""
      with:
        registry: quay.io
        organization: ${{ inputs.quay_io_organization }}
        login: ${{ secrets.quay_io_login }}
        password: ${{ secrets.quay_io_password }}
